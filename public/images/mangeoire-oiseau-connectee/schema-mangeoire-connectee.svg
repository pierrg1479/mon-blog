<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 980" width="480" height="980" role="img" aria-labelledby="titre desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="titre">Schéma de la mangeoire connectée</title>
  <desc id="desc">La caméra du jardin envoie deux flux au hub Reolink. Frigate, sur le mini PC, repère l'oiseau et reconnaît son espèce en local, puis publie la fin de visite en MQTT sur Mosquitto, hébergé par le Home Assistant Green. n8n, sur le mini PC, crée une fiche dans Notion et publie la photo et l'extrait dans Slack, ainsi que le bilan du mois.</desc>
  <defs>
    <marker id="fleche" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      .bande-label { font-size: 12px; font-weight: 700; letter-spacing: 1.2px; }
      .boite { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .titre { font-size: 18px; font-weight: 700; fill: #0f172a; }
      .sous { font-size: 15px; fill: #475569; }
      .etape { font-size: 15px; fill: #1e293b; }
      .legende { font-size: 15px; fill: #334155; }
      .trait { stroke: #64748b; stroke-width: 2; fill: none; }
      .pastille { fill: #ea580c; }
      .num { font-size: 13px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    </style>
  </defs>

  <!-- Bandes : jardin, maison, en ligne -->
  <rect x="0" y="0" width="480" height="160" fill="#f0fdf4"/>
  <rect x="0" y="160" width="480" height="620" fill="#eff6ff"/>
  <rect x="0" y="780" width="480" height="200" fill="#faf5ff"/>
  <text x="456" y="26" text-anchor="end" class="bande-label" fill="#15803d">JARDIN</text>
  <text x="456" y="184" text-anchor="end" class="bande-label" fill="#1d4ed8">RÉSEAU DE LA MAISON</text>
  <text x="456" y="804" text-anchor="end" class="bande-label" fill="#7e22ce">EN LIGNE</text>

  <!-- Caméra -->
  <rect x="24" y="40" width="432" height="70" rx="12" class="boite"/>
  <text x="44" y="68" class="titre">Caméra Reolink Lumus Pro</text>
  <text x="44" y="92" class="sous">Wi-Fi, sur secteur, lentille +4</text>

  <!-- 1 : flux vers le hub -->
  <line x1="90" y1="110" x2="90" y2="196" class="trait" marker-end="url(#fleche)"/>
  <circle cx="118" cy="150" r="11" class="pastille"/><text x="118" y="155" class="num">1</text>
  <text x="136" y="155" class="legende">Deux flux : 640 × 360 et 1080p</text>

  <!-- Hub -->
  <rect x="24" y="200" width="432" height="60" rx="12" class="boite"/>
  <text x="44" y="226" class="titre">Hub Reolink Home Hub Lite</text>
  <text x="44" y="248" class="sous">relaie les flux de la caméra</text>

  <line x1="90" y1="260" x2="90" y2="316" class="trait" marker-end="url(#fleche)"/>
  <text x="110" y="294" class="legende">flux RTSP</text>

  <!-- Frigate : 2 et 3 -->
  <rect x="24" y="320" width="432" height="130" rx="12" class="boite"/>
  <text x="44" y="348" class="titre">Frigate, sur le mini PC</text>
  <circle cx="48" cy="380" r="11" class="pastille"/><text x="48" y="385" class="num">2</text>
  <text x="68" y="385" class="etape">Repère un oiseau dans la zone (5 images/s)</text>
  <circle cx="48" cy="418" r="11" class="pastille"/><text x="48" y="423" class="num">3</text>
  <text x="68" y="423" class="etape">Reconnaît l'espèce en local (≥ 90 %)</text>

  <!-- 4 : MQTT -->
  <line x1="90" y1="450" x2="90" y2="516" class="trait" marker-end="url(#fleche)"/>
  <circle cx="118" cy="485" r="11" class="pastille"/><text x="118" y="490" class="num">4</text>
  <text x="136" y="490" class="legende">Fin de visite publiée en MQTT</text>

  <!-- Mosquitto -->
  <rect x="24" y="520" width="432" height="60" rx="12" class="boite"/>
  <text x="44" y="546" class="titre">Mosquitto, sur le Home Assistant Green</text>
  <text x="44" y="568" class="sous">serveur MQTT</text>

  <line x1="90" y1="580" x2="90" y2="636" class="trait" marker-end="url(#fleche)"/>
  <text x="110" y="614" class="legende">abonné à frigate/events</text>

  <!-- n8n : 5 -->
  <rect x="24" y="640" width="432" height="90" rx="12" class="boite"/>
  <text x="44" y="668" class="titre">n8n, sur le mini PC</text>
  <circle cx="48" cy="700" r="11" class="pastille"/><text x="48" y="705" class="num">5</text>
  <text x="68" y="705" class="etape">Crée la fiche et publie la visite</text>

  <!-- Vers Notion et Slack -->
  <line x1="126" y1="730" x2="126" y2="816" class="trait" marker-end="url(#fleche)"/>
  <line x1="354" y1="730" x2="354" y2="816" class="trait" marker-end="url(#fleche)"/>

  <!-- Notion -->
  <rect x="24" y="820" width="204" height="130" rx="12" class="boite"/>
  <text x="40" y="850" class="titre">Notion</text>
  <text x="40" y="878" class="sous">Une fiche par visite :</text>
  <text x="40" y="900" class="sous">espèce, photo, date,</text>
  <text x="40" y="922" class="sous">score</text>

  <!-- Slack : 5 et 6 -->
  <rect x="252" y="820" width="204" height="130" rx="12" class="boite"/>
  <text x="268" y="850" class="titre">Slack</text>
  <text x="268" y="878" class="sous">Photo et extrait</text>
  <text x="268" y="900" class="sous">de 25 s par visite</text>
  <circle cx="276" cy="925" r="11" class="pastille"/><text x="276" y="930" class="num">6</text>
  <text x="294" y="930" class="sous">Bilan du mois</text>
</svg>
